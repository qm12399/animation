  g.fillStyle = 'rgba(255,255,255,.7)'; g.font = `500 ${11 * S}px Inter`; g.fillText(sub, x + 46 * S, y + 11 * S);

function title(k) {

  g.save(); g.globalAlpha = k; g.textAlign = 'center'; g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 14 * S;
  g.fillStyle = 'rgba(255,255,255,.85)'; g.font = `700 ${12 * S}px Inter`; g.letterSpacing = `${4 * S}px`;
  g.fillText('FISCHLOGIK · FOLGE 1', W / 2, 128 * S); g.letterSpacing = '0px';
  g.font = `italic 700 ${54 * S}px Playfair`; g.fillStyle = '#fff'; g.fillText('Wo sind die', W / 2, 192 * S);
  const a = 'Fische', b = ' im Teich?'; const wa = g.measureText(a).width, wb = g.measureText(b).width, x0 = W / 2 - (wa + wb) / 2;

// karaoke subtitles: chunks of up to 4 words, words light up as spoken
let CHUNKS = [];
function buildChunks(lines) {
  lines.forEach((l, li) => {
    const toks = l.text.split(/\s+/), at = LINE_AT[li];
    let cur = [];
    toks.forEach((tk, i) => {
      const w = l.words[i]; cur.push({ tk, t0: at + w.t0, t1: at + w.t1 });

    });
  });
  CHUNKS.forEach((c, i) => {
    c.a = c.words[0].t0 - .06;
    const nx = CHUNKS[i + 1]; c.b = c.last ? c.words.at(-1).t1 + .45 : nx.words[0].t0 - .06;

}
function karaoke(t) {
  const c = CHUNKS.find(c => t >= c.a && t < c.b); if (!c) return;
  g.save(); g.font = `800 ${38 * S}px Inter`; g.textBaseline = 'middle';
  const sp = g.measureText(' ').width, ws = c.words.map(w => g.measureText(w.tk).width), tot = ws.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);

function dottedArc(cam, a, b, h, k, n = 22, color = 'rgba(255,240,210,.95)') {   // dotted cast arc, drawn up to k

  for (let i = 0; i <= 64; i++) { const a = i / 64 * Math.PI * 2 * eo(k); const s = toScreen(cam, c.clone().add(V3(Math.cos(a) * r, 0, Math.sin(a) * r))); i ? g.lineTo(s.x, s.y) : g.moveTo(s.x, s.y); }

// =====================================================================
// render(t)
// =====================================================================
window.render = t => {
  g.clearRect(0, 0, W, H);
  if (t < CUT_B) {                                  // ---- A: map
    waterA.uniforms.uT.value = t; waterA.uniforms.uContour.value = seg(t, 1.6, 2.4);
    const dive = eio(seg(t, 2.75, CUT_B));
