<script type="module">
import { THREE, V3, W, H, S, renderer, draw, TIME, clamp, lerp, seg, ss, eio, eo, ei, keys, toScreen, glowPoints, rng } from './engine/core.js';
import { buildLake, shore, sdist, lakeR, PLACES } from './engine/lake.js';
import { makeAngler, POSES, castPose, walkPose, blendPose } from './engine/angler.js';
import { makeFish, makeSchool, placeSchool } from './engine/fish.js';
import { buildUnder, bedHeight } from './engine/under.js';
import { buildSection, buildBankCut, THERMO } from './engine/section.js';
import * as UI from './engine/ui.js';
const { C } = UI;

// ---------------- assets ----------------
const logo = new Image(); logo.src = 'engine/fonts/logo.png'; await logo.decode();
await Promise.all([document.fonts.load('800 20px PJS'), document.fonts.load('italic 900 20px PF')]);
const words = await (await fetch('voice/words.json')).json();
UI.setWords(words, new Set(['Mitte', 'mitten', 'Fisch', 'Schichten', 'warmes', '24', 'kaltes', 'Sprungschicht', 'vier', 'Sauerstoff', 'Zone', 'sauerstofffreie', 'atmen', 'Barsch', 'Hecht', 'Füßen', 'Scharkante', 'drei', 'stampfst', 'Abstand', 'parallel', 'Wind', 'Uferseite', 'Rotaugen', 'Hechte', 'Gesicht', 'Bacheinläufen', 'Krautkanten', 'Licht', 'Seemitte', 'Kanten']));

// ---------------- worlds ----------------
const L = buildLake(logo), A = makeAngler(logo); L.scene.add(A.root);
const U = buildUnder(), X = buildSection(), B = buildBankCut();
const A2 = makeAngler(logo); B.scene.add(A2.root);
const cam = new THREE.PerspectiveCamera(46, W / H, .1, 1200);
const CENTER = V3(0, .1, 0);
const spot = shore(PLACES.bankTh, 2.4); spot.y = L.terrainHeight(spot.x, spot.z);
const windSpot = shore(PLACES.windTh, 2.2); windSpot.y = L.terrainHeight(windSpot.x, windSpot.z);
const backSpot = shore(PLACES.bankTh, 5.5); backSpot.y = L.terrainHeight(backSpot.x, backSpot.z);

// extra lake actors: plankton + roach school as glow points (map view)
const R = rng(42);
const plank = []; for (let i = 0; i < 260; i++) { const a = R() * 6.3, rr = Math.sqrt(R()) * .8, [ex, ez] = lakeR(a); const tgt = shore(PLACES.windTh + (R() - .5) * 1.1, -.8 - R() * 3); plank.push({ a: V3(ex * rr, .15, ez * rr), b: tgt, d: R() * .5 }); }
const plankPts = glowPoints(plank.map(p => p.a), .55, [1.4, 1.8, 1.2]); L.scene.add(plankPts);
const roach = []; for (let i = 0; i < 26; i++) roach.push({ o: V3((R() - .5) * 5, .2, (R() - .5) * 4), d: R() * .3 });
const roachPts = glowPoints(roach.map(r => r.o), 1.3, [1.6, 1.9, 2.4]); L.scene.add(roachPts);
function lakeActors(t) {
  const kp = eio(seg(t, 42.2, 45.2)), pp = plankPts.geometry.attributes.position;
  plank.forEach((p, i) => { const k = clamp(kp * 1.25 - p.d * .5); const q = p.a.clone().lerp(p.b, eio(k)); q.x += Math.sin(t * 1.3 + i) * .25; pp.setXYZ(i, q.x, q.y, q.z); });
  pp.needsUpdate = true; plankPts.material.opacity = seg(t, 41.4, 42.2) * (1 - seg(t, 47.2, 47.6));
  const kr = eio(seg(t, 45.3, 47.3)), c0 = V3(-6, .2, 6), c1 = shore(PLACES.windTh, -4.5).setY(.2), rp = roachPts.geometry.attributes.position;
  roach.forEach((r, i) => { const q = c0.clone().lerp(c1, clamp(kr * 1.2 - r.d)).add(r.o); q.x += Math.sin(t * 2 + i) * .3; rp.setXYZ(i, q.x, q.y, q.z); });
  rp.needsUpdate = true; roachPts.material.opacity = seg(t, 45.2, 45.6) * (1 - seg(t, 47.2, 47.5));
}

// underwater actors
const perch = makeFish('barsch', .55); const pike = makeFish('hecht', 1.25, { amp: .06, freq: 6 });
const perch2 = makeFish('barsch', .45);
U.scene.add(perch, pike, perch2);
const schoolList = []; { const r = rng(8); for (let i = 0; i < 46; i++) schoolList.push({ p: V3((r() - .5) * 3.2, (r() - .5) * 1.4, (r() - .5) * 1.6), yaw: (r() - .5) * .25, s: .8 + r() * .4, phase: r() * 6 }); }
const school = makeSchool('rotauge', .32, schoolList); U.scene.add(school);
const xPerch = makeFish('barsch', .7); X.scene.add(xPerch);
const bPerch = makeFish('barsch', .55), bPike = makeFish('hecht', 1.1, { amp: .06, freq: 6 }); B.scene.add(bPerch, bPike);
for (const o of [school, plankPts, roachPts, U.bubbles, perch, pike, perch2, xPerch]) o.frustumCulled = false;

// ---------------- helpers ----------------
function lookFrom(c, p, at, up = V3(0, 1, 0)) { c.position.copy(p); c.up.copy(up).normalize(); c.lookAt(at); c.updateMatrixWorld(); }
function fishAt(f, p, yaw, pitch = 0, phase = 0) { f.position.copy(p); f.rotation.set(0, yaw, pitch); f.material.userData.phase.value = phase; }
const sp = p => toScreen(cam, p);
function lakeMode(t, { refl = false, focus, aper = 0, fishGlow = true, wind = .3, map = 0, dead = 0, fog = [250, 900], shadow = [V3(), 70], sat } = {}) {
  TIME.value = t; L.setReflect(refl); L.setFog(...fog); L.shadowFocus(...shadow); L.fishGlow.visible = fishGlow;
  const wu = L.water.material.uniforms; wu.uWind.value = wind; wu.uMap.value = map; wu.uDead.value = dead;
  L.fishGlow.material.opacity = .75 + .25 * Math.sin(t * 2.6);
  lakeActors(t);
  draw(L.scene, cam, { focus, aper, vig: refl ? .32 : .5, bloom: .45, sat });
}
const lurePath = (() => { let cache = null; return () => cache || (cache = (() => { A.root.position.copy(spot); A.root.rotation.y = 0; A.apply(castPose(.62)); const a = A.tipWorld(), ctrl = a.clone().lerp(CENTER, .45).add(V3(0, 34, 0)), pts = []; for (let i = 0; i <= 70; i++) { const u = i / 70; pts.push(a.clone().multiplyScalar((1 - u) ** 2).add(ctrl.clone().multiplyScalar(2 * u * (1 - u))).add(CENTER.clone().multiplyScalar(u * u))); } return pts; })()); })();
const lureAt = u => { const P = lurePath(), f = clamp(u) * (P.length - 1), i = Math.min(P.length - 2, Math.floor(f)); return P[i].clone().lerp(P[i + 1], f - i); };

// ---------------- shots ----------------
// each: [t0, t1, render3D(t), overlay(t)]
const SHOTS = [];
const shot = (t0, t1, r3, ov = () => {}) => SHOTS.push({ t0, t1, r3, ov });

// 1+2+3: cast -> follow the lure -> crane up to the map -> title -> dive
const LURE0 = .66, LURE1 = 2.75;
shot(0, 8.75, t => {
  A.root.position.copy(spot); A.root.rotation.y = 0; A.apply(castPose(t - .04), t);
  const lu = lureAt(eo(seg(t, LURE0, LURE1)) * .35 + seg(t, LURE0, LURE1) * .65);
  const P = keys([[0, spot.clone().add(V3(.45, 1.9, 4.4))], [1.25, spot.clone().add(V3(.45, 1.7, 4.2))], [2.15, spot.clone().add(V3(0, 26, 12))], [3.05, V3(0, 78, 16)], [3.7, V3(0, 92, 2.5)], [8.25, V3(1.2, 82, 1.5)], [8.75, V3(0, 8, .5)]], t, eio);
  if (t > 8.25) P.copy(V3(1.2, 82, 1.5).lerp(V3(0, 6, .3), ei(seg(t, 8.25, 8.75))));
  const look0 = spot.clone().add(V3(.9, 3.0, -10));
  const w = ss(seg(t, .55, 1.2)) * (1 - ss(seg(t, 1.9, 3.0)));
  const at = look0.clone().lerp(lu, w * .85).lerp(CENTER, ss(seg(t, 1.9, 3.1)));
  const upK = ss(seg(t, 2.0, 3.6)); const up = V3(0, 1 - upK, -upK);
  lookFrom(cam, P, at, up);
  const high = P.y > 20;
  lakeMode(t, { refl: !high, focus: high ? 1e6 : 6, aper: high ? 0 : 4, fishGlow: t > 2.6, map: seg(t, 6.6, 7.6) * .9, fog: high ? [200, 900] : [45, 300], shadow: high ? [V3(), 70] : [spot, 16] });
}, t => {
  // lure glow + dotted trail
  const k = seg(t, LURE0, LURE1);
  if (t > LURE0 && t < 4) {
    const P = lurePath(), n = Math.floor(k * (P.length - 1));
    UI.dots(cam, P.slice(0, n + 1), 1, { r: 2.8, glow: true, alpha: 1 - seg(t, 5.3, 5.8) });
    if (k < 1) { const s = sp(lureAt(eo(k) * .35 + k * .65)); UI.g.save(); UI.g.fillStyle = '#fff6e0'; UI.g.shadowColor = '#ffe9b0'; UI.g.shadowBlur = 24 * S; UI.g.beginPath(); UI.g.arc(s.x, s.y, 7 * S, 0, 7); UI.g.fill(); UI.g.restore(); }
  } else if (t >= 4) UI.dots(cam, lurePath(), 1, { r: 2.8, alpha: 1 - seg(t, 5.3, 5.8) });
  const kp = seg(t, LURE1, LURE1 + .9); if (kp > 0 && kp < 1) UI.ring(cam, CENTER, .5 + kp * 4, 1 - kp, 'rgba(255,255,255,.9)', { n: 40 });
  // empty middle
  const kr = seg(t, 3.5, 4.1) * (1 - seg(t, 5.6, 6.0));
  UI.ring(cam, CENTER, 7, kr, 'rgba(240,120,110,.95)', { n: 46, dot: 2.6 });
  if (kr > 0) { const s = sp(V3(0, .1, -7)), c = sp(CENTER); UI.callout('0 Fische', s.x, s.y, 0, -46, seg(t, 4.4, 4.9) * (1 - seg(t, 5.6, 6.0)), { dot: C.red }); }
  UI.title(1, [['Wo stehen die', 0]], [['Fische', 1], [' im See?', 0]], seg(t, 5.9, 6.4) * (1 - seg(t, 8.0, 8.35)));
});

// 4+5: cross-section
shot(8.75, 21.95, t => {
  TIME.value = t; X.update(t);
  const u = X.slabM.uniforms; u.uLayers.value = ss(seg(t, 8.8, 9.6)); u.uReveal.value = eio(seg(t, 13.0, 14.0)); u.uDead.value = ss(seg(t, 16.5, 19.4));
  X.oxM.opacity = seg(t, 15.2, 15.8) * lerp(.9, .15, seg(t, 16.6, 19.2));
  const pz = keys([[8.75, 16.5], [14.5, 14.6], [21.95, 13.4]], t, eio), py = keys([[8.75, -1.6], [14.5, -2.1], [21.95, -3.3]], t, eio);
  lookFrom(cam, V3(lerp(-.3, .3, seg(t, 8.75, 21.95)), py, pz), V3(0, py - .2, 0));
  fishAt(xPerch, V3(lerp(-3.5, 3.5, seg(t, 8.75, 16)), -1.1 + .15 * Math.sin(t), .5), 0, .03 * Math.sin(t * 2), t * 0);
  draw(X.scene, cam, { vig: .42, bloom: .3, sat: .9 });
}, t => {
  UI.chapter('1', 'ZWEI SCHICHTEN', 'im Sommer', seg(t, 9.0, 9.4) * (1 - seg(t, 14.3, 14.6)));
  UI.chapter('2', 'KEIN SAUERSTOFF', 'ab etwa 4 m Tiefe', seg(t, 14.7, 15.1));
  const a = s => sp(s);
  { const s = a(V3(-2.0, -1.0, 0)); UI.callout('Warm · 24 °C', s.x, s.y, 38, 0, seg(t, 10.2, 10.75), { dot: C.orange }); }
  { const s = a(V3(-2.0, -4.6, 0)); UI.callout('Kalt', s.x, s.y, 38, 0, seg(t, 11.7, 12.2), { dot: C.blue }); }
  { const s = a(V3(1.4, -THERMO, 0)); UI.callout('Sprungschicht', s.x, s.y, -30, -44, seg(t, 13.9, 14.4), { dot: '#cfe3df' }); }
  const s0 = a(V3(-3, 0, 0)), s4 = a(V3(-3, -4, 0)), ppm = (s4.y - s0.y) / 4;
  UI.depthRuler(26 * S, s0.y, ppm, [0, 2, 4, 6], seg(t, 15.0, 15.7), t > 15.6 ? 4 : -1);
  UI.polyline(cam, [V3(-8, -4, 0), V3(8, -4, 0)], seg(t, 15.7, 16.4), 'rgba(251,196,100,.85)', 2, [6, 7]);
  { const s = a(V3(1.0, -5.5, 0)); UI.callout('sauerstofffreie Zone', s.x, s.y, -10, 46, seg(t, 20.5, 21.0), { dot: C.red }); }
});

// 6: perch avoids the dead zone
shot(21.95, 25.6, t => {
  TIME.value = t; U.setMode('open'); U.update(t); U.murk.visible = true; school.visible = false; pike.visible = false; perch2.visible = false; perch.visible = true;
  const u = seg(t, 21.95, 25.6);
  const p = keys([[21.95, V3(10.5, -1.6, 0)], [23.7, V3(13.6, -3.3, 0)], [24.2, V3(14.2, -3.35, .2)], [25.6, V3(15.6, -1.5, .4)]], t, ss);
  const yaw = t < 23.6 ? 0 : -Math.PI * ss(seg(t, 23.6, 24.4)) * .9, pitch = t < 23.6 ? -.45 : lerp(-.45, .5, ss(seg(t, 23.6, 24.4)));
  fishAt(perch, p, yaw, pitch, 0);
  lookFrom(cam, V3(lerp(10.5, 14.5, ss(u)), -2.2, 5.2), V3(lerp(11.5, 14.6, ss(u)), -2.8, 0));
  draw(U.scene, cam, { focus: 5.2, aper: 3, vig: .5, bloom: .4 });
}, t => {
  const s = sp(V3(14.2, -4.3, 0)); UI.callout('kein Sauerstoff', s.x, s.y, 0, 54, seg(t, 24.3, 24.8), { dot: C.red });
});

// 7: back to the map: dead middle, fish on the edges
shot(25.6, 27.75, t => {
  A.root.position.copy(spot); A.root.rotation.y = 0; A.apply(POSES.idle, t);
  const P = keys([[25.6, V3(0, 90, 2)], [27.2, V3(0, 80, 8)], [27.75, V3(0, 20, 30)]], t, eio);
  lookFrom(cam, P, V3(0, 0, lerp(0, 34, ss(seg(t, 27.1, 27.75)))), V3(0, 0, -1));
  lakeMode(t, { map: .9, dead: .9 });
}, t => {
  const pts = []; for (let i = 0; i <= 80; i++) { const th = i / 80 * 6.283, [x, z] = lakeR(th); pts.push(V3(x * .42, .1, z * .42)); }
  UI.polyline(cam, pts, seg(t, 25.7, 26.3) * (1 - seg(t, 27.3, 27.6)), 'rgba(235,225,210,.75)', 2);
  { const s = sp(CENTER); UI.callout('tote Zone', s.x, s.y, 0, -40, seg(t, 25.8, 26.2) * (1 - seg(t, 27.3, 27.6)), { dot: C.red }); }
  { const s = sp(shore(1.9, -2)); UI.callout('Barsch', s.x, s.y, -50, 0, seg(t, 26.3, 26.7) * (1 - seg(t, 27.3, 27.6)), { dot: C.gold }); }
  { const s = sp(shore(4.4, -2)); UI.callout('Hecht', s.x, s.y, 50, 0, seg(t, 26.84, 27.2) * (1 - seg(t, 27.3, 27.6)), { dot: C.gold }); }
});

// 8: shallow shelf, the drop-off (Scharkante)
shot(27.75, 33.35, t => {
  TIME.value = t; U.setMode('shallow'); U.update(t); U.murk.visible = false; school.visible = false; perch.visible = true; pike.visible = true; perch2.visible = true;
  const u = seg(t, 27.75, 33.35);
  { const x1 = .7 + .3 * Math.sin(t * .7), z1 = -1 + u * 1.2; fishAt(perch, V3(x1, bedHeight(x1, z1) + .45, z1), -.25 + .1 * Math.sin(t), 0, 0); }
  { const x2 = -.6 + .2 * Math.sin(t * .9 + 1), z2 = 1.3 + u * .8; fishAt(perch2, V3(x2, bedHeight(x2, z2) + .4, z2), -.6, 0, 2); }
  { const z3 = lerp(-2, 1.5, u); fishAt(pike, V3(2.4, bedHeight(2.4, z3) + .7, z3), -1.45, 0, 1); }
  lookFrom(cam, V3(lerp(-3.6, -2.8, u), lerp(-.55, -.8, u), lerp(5.5, 3.6, u)), V3(lerp(.6, 1.2, u), -2.0, lerp(-.5, 0, u)));
  draw(U.scene, cam, { focus: 5, aper: 3.5, vig: .45, bloom: .35, sat: .9 });
}, t => {
  { const s = sp(V3(1.0, bedHeight(1.0, -.4) + .05, -.4)); UI.callout('Scharkante', s.x, s.y, 0, -70, seg(t, 30.45, 30.9), { dot: C.gold }); }
  UI.polyline(cam, [V3(-6, -1.15, 1), V3(.9, -1.5, 1)], seg(t, 31.6, 32.2), 'rgba(255,255,255,.85)', 2, [5, 6]);
  { const s = sp(V3(-2.5, -1.2, 1)); UI.pill('nur 3 m vom Ufer', s.x, s.y - 40 * S, seg(t, 31.7, 32.1), { dot: C.gold }); }
});

// 9: stomping at the edge scares the fish away (side cutaway)
const STOMP = 34.62;
shot(33.35, 36.4, t => {
  TIME.value = t;
  const walkEnd = 34.25;
  const x = lerp(-4.2, -.7, eo(seg(t, 33.35, walkEnd)));
  let P = walkPose(t - 33.35, 2.2);
  if (t > walkEnd) P = t < 34.48 ? blendPose(walkPose(walkEnd - 33.35, 2.2), POSES.stompUp, eio(seg(t, walkEnd, 34.48))) : t < STOMP ? blendPose(POSES.stompUp, POSES.stompDn, ei(seg(t, 34.48, STOMP))) : blendPose(POSES.stompDn, POSES.idle, ss(seg(t, STOMP + .3, 36.2)) * .5);
  A2.root.position.set(x, .44 + (t < walkEnd ? Math.abs(Math.sin((t - 33.35) * 2.2 * Math.PI)) * .03 : 0), 0); A2.root.rotation.y = -Math.PI / 2; A2.apply(P, t);
  const flee = ei(seg(t, 35.15, 35.9));
  fishAt(bPerch, V3(1.9 + flee * 9, -.7, .5), flee > 0 ? 0 : Math.PI, 0, 0); fishAt(bPike, V3(3.1 + flee * 11, -.95, -.3), flee > 0 ? 0 : Math.PI, 0, 1);
  bPerch.material.userData.amp.value = flee > 0 ? .2 : .09;
  const shake = t > STOMP && t < STOMP + .25 ? Math.sin(t * 90) * .04 * (1 - seg(t, STOMP, STOMP + .25)) : 0;
  lookFrom(cam, V3(.6, .7 + shake, lerp(10.4, 9.6, seg(t, 33.35, 36.4))), V3(.6, -.2, 0));
  draw(B.scene, cam, { vig: .38, bloom: .3 });
}, t => {
  const foot = sp(V3(-.65, .45, 0));
  for (let i = 0; i < 3; i++) { const k = seg(t, STOMP + i * .15, STOMP + .9 + i * .15); if (k > 0 && k < 1) UI.screenRing(foot.x, foot.y, (30 + k * 110) * S, 1, 'rgba(255,255,255,.95)', { half: false, n: 28, alpha: 1 - k, sy: .5 }); }
  UI.callout('Stampf!', foot.x, foot.y, 0, -60, seg(t, STOMP, STOMP + .35) * (1 - seg(t, 36.0, 36.3)), { dot: C.red });
});

// 10: top-down close: stay back, cast parallel to the bank
const castT = 37.45;
const parTarget = shore(PLACES.bankTh + .42, -2.2).setY(.1);
shot(36.4, 39.6, t => {
  A.root.position.copy(backSpot); A.root.rotation.y = -1.25; A.apply(castPose(t - castT), t);
  const P = keys([[36.4, backSpot.clone().add(V3(-1.5, 17, 1))], [38.9, backSpot.clone().add(V3(-2.5, 15, .5))], [39.6, V3(0, 70, 10)]], t, eio);
  const at = keys([[36.4, backSpot.clone().add(V3(-1.6, 0, -4.2))], [38.9, backSpot.clone().add(V3(-2.6, 0, -4.6))], [39.6, V3(0, 0, 4)]], t, eio);
  lookFrom(cam, P, at, V3(0, 0, -1));
  lakeMode(t, { fishGlow: false, shadow: [backSpot, 18] });
}, t => {
  const edge = shore(PLACES.bankTh, .2).setY(.4), me = backSpot.clone().setY(.5);
  const ka = seg(t, 36.8, 37.2) * (1 - seg(t, 38.9, 39.2));
  UI.polyline(cam, [me, edge], ka, 'rgba(255,255,255,.85)', 2, [4, 6]);
  { const s = sp(me.clone().lerp(edge, .5)); UI.pill('Abstand halten', s.x + 70 * S, s.y, ka, { dot: C.gold }); }
  const kc = seg(t, castT + .6, castT + 1.3);
  if (kc > 0) { A.apply(castPose(.62)); const tip = A.tipWorld(); A.apply(castPose(t - castT)); UI.dots(cam, UI.arcPts(tip, parTarget, 3, 36), kc, { r: 2.6, alpha: 1 - seg(t, 38.9, 39.2) }); }
  { const s = sp(parTarget); UI.callout('parallel zum Ufer', s.x, s.y, 0, -50, seg(t, castT + 1.3, castT + 1.7) * (1 - seg(t, 38.9, 39.2)), { dot: C.gold }); }
});

// 11: the wind on the map: plankton and roach drift to the windward bank
shot(39.6, 47.45, t => {
  A.root.position.copy(spot); A.root.rotation.y = 0; A.apply(POSES.idle, t);
  const P = keys([[39.6, V3(0, 70, 10)], [40.3, V3(0, 88, 3)], [46.9, V3(2.5, 78, 2)], [47.45, V3(6, 14, 0)]], t, eio);
  const at = keys([[39.6, V3(0, 0, 4)], [40.3, V3(0, 0, 0)], [46.9, V3(2, 0, 0)], [47.45, V3(8, 0, 0)]], t, eio);
  lookFrom(cam, P, at, V3(0, 0, -1));
  lakeMode(t, { wind: lerp(.3, 1.2, seg(t, 40.8, 42)), fishGlow: t < 45.2 });
}, t => {

const DISS = { 8.75: .32, 21.95: .4, 25.6: .4, 27.75: .3, 36.4: .35, 47.45: .3, 49.5: .4, 53.1: .45, 56.35: .4, 58.95: .45 };

  UI.clear();

  const d = DISS[s.t0], prev = SHOTS[i - 1];

  else {
    const nx = SHOTS[i + 1], dn = nx && DISS[nx.t0];
