<script type="module">
import { THREE, V3, W, H, S, renderer, draw, TIME, clamp, lerp, seg, ss, eio, eo, ei, keys, toScreen, rng, std, instances } from './engine/core.js';

import { buildUnder, bedHeight } from './engine/under.js';

const { C, g } = UI;

const logo = new Image(); logo.src = 'engine/fonts/logo.png'; await logo.decode();
await Promise.all([document.fonts.load('800 20px PJS'), document.fonts.load('italic 900 20px PF')]);
const words = await (await fetch('voice/words.json')).json();
UI.setWords(words, new Set(['Kunstköder', 'drei', 'Tiefen', 'Oberfläche', 'Popper', 'Wasserblasen', 'Stickbait', 'Zickzack', 'Walk-the-Dog', 'Gummifrosch', 'Hänger', 'Mittelwasser', 'Spinner', 'Blatt', 'Blinker', 'Lichtblitze', 'Crankbait', 'Tauchschaufel', 'wackeln', 'Twitchbait', 'Ruck', 'Pause', 'regungslos', 'Chatterbait', 'Druck', 'Gewässergrund', 'Gummifisch', 'Schaufelschwanz', 'Zander', 'Twister', 'Sichelschwanz', 'Krebsimitat', 'Flussbarsche', 'Zikade', 'Grund', 'Rute', 'wahllos', 'Wassertiefe']));

// ---------------- worlds ----------------
const L = buildLake(logo), A = makeAngler(logo); L.scene.add(A.root);
const U = buildUnder(), X = buildSection();
const cam = new THREE.PerspectiveCamera(46, W / H, .05, 1200);
const sp = p => toScreen(cam, p);

const spot = shore(PLACES.bankTh, 2.4); spot.y = L.terrainHeight(spot.x, spot.z);

// shop: a pegboard wall of lures
const SH = new THREE.Scene(); SH.background = new THREE.Color(0x2b2420);
SH.add(new THREE.HemisphereLight(0xfff0dc, 0x3a3028, 1.4)); { const d = new THREE.DirectionalLight(0xffe6c4, 2.2); d.position.set(2, 4, 5); SH.add(d); }
{ const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d'); x.fillStyle = '#b48c62'; x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 16; i++) for (let j = 0; j < 16; j++) { x.fillStyle = '#4a3624'; x.beginPath(); x.arc(16 + i * 32, 16 + j * 32, 4.5, 0, 7); x.fill(); }
  const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(4, 6);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(8, 12), new THREE.MeshStandardMaterial({ map: tx, roughness: .9 })); wall.position.z = -.25; SH.add(wall); }
const shopL = LURE_KINDS.map((k, i) => { const Lr = makeLure(k, .42); const col = i % 3, row = Math.floor(i / 3); Lr.home = V3((col - 1) * .62, 1.25 - row * .78, 0);
  const peg = new THREE.Mesh(new THREE.CylinderGeometry(.012, .012, .25, 6).rotateX(Math.PI / 2), std(0xaaaaaa, { metalness: .8, roughness: .3 })); peg.position.copy(Lr.home).add(V3(0, .25, -.12)); SH.add(peg);
  Lr.wrap.rotation.z = -Math.PI / 2 + .12 * Math.sin(i); SH.add(Lr.wrap); return Lr; });

// section overview: all lures at their depths
const SLOT = { popper: [-2.4, -.08], stickbait: [0, -.08], frog: [2.4, -.04], spinner: [-2.6, -1.7], blinker: [0, -1.4], crankbait: [2.6, -1.9], twitchbait: [-1.4, -3.1], chatterbait: [1.4, -3.2],

const secL = LURE_KINDS.map((k, i) => { const Lr = makeLure(k, 1.05); const [x, y] = SLOT[k]; Lr.slot = V3(x, y || bottomY(x) + .32, .9); Lr.i = i; X.scene.add(Lr.wrap); return Lr; });

// detail lures: surface ones on the lake, the rest underwater
const D = {}; LURE_KINDS.forEach((k, i) => { D[k] = makeLure(k, .55); (i < 3 ? L.scene : U.scene).add(D[k].wrap); D[k].wrap.visible = false; });
const trout = makeFish('forelle', .7), perch = makeFish('barsch', .55), pike = makeFish('hecht', 1.2, { amp: .03, freq: 4 }), zander = makeFish('zander', 1.0, { amp: .05, freq: 6 }), bigPerch = makeFish('barsch', .75);
U.scene.add(trout, perch, pike, zander, bigPerch);
const stones = []; { const r = rng(3); for (let i = 0; i < 26; i++) { const x = -5 + r() * 4.5, z = 2.3 + r() * 1.3; stones.push({ p: V3(x, bedHeight(x, z) + .05, z), r: new THREE.Euler(r() * 3, r() * 3, 0), s: V3(1, .65, 1).multiplyScalar(.12 + r() * .16) }); } }
const stoneMesh = instances(new THREE.DodecahedronGeometry(1, 0), std(0x77736a, { flatShading: true }), stones, o => o); U.scene.add(stoneMesh);
for (const o of [trout, perch, pike, zander, bigPerch, U.bubbles]) o.frustumCulled = false;
function showOnly(list) { LURE_KINDS.forEach(k => D[k].wrap.visible = list.includes(k)); for (const f of [trout, perch, pike, zander, bigPerch]) f.visible = list.includes(f); }

function lakeMode(t, o = {}) {
  TIME.value = t; L.setReflect(!!o.refl); L.setFog(...(o.fog || [45, 300])); L.shadowFocus(...(o.shadow || [V3(), 70])); L.fishGlow.visible = false;
  const wu = L.water.material.uniforms; wu.uWind.value = o.wind ?? .2; wu.uMap.value = 0; wu.uDead.value = 0;

}

function sectionMode(t, o = {}) { TIME.value = t; X.update(t); const u = X.slabM.uniforms; u.uLayers.value = .35; u.uReveal.value = 0; u.uDead.value = 0; X.oxM.opacity = 0; draw(X.scene, cam, { vig: .42, bloom: .35 }); }

    g.fillStyle = on ? C.gold : 'rgba(255,255,255,.35)'; g.beginPath(); g.roundRect(x - 3 * S, ya + 4 * S, 6 * S, h / 3 - 8 * S, 3 * S); g.fill();
    g.save(); g.translate(x + 16 * S, ya + h / 6); g.rotate(-Math.PI / 2); g.font = `${on ? 800 : 600} ${12 * S}px PJS`; g.textAlign = 'center'; g.fillStyle = on ? '#fff' : 'rgba(255,255,255,.55)'; g.fillText(lb.toUpperCase(), 0, 0); g.restore();

}

  for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + (r() - .5) * 2.2, v = (60 + r() * 90) * S * size, tt = k * .8; const px = x + Math.cos(a) * v * tt * 1.4, py = y + Math.sin(a) * v * tt * 1.6 + 260 * S * tt * tt * size; g.globalAlpha = 1 - k; g.beginPath(); g.arc(px, py, (1.5 + r() * 2.5) * S, 0, 7); g.fill(); }

}

const name = (n, title, sub, t, a, b) => UI.chapter(n, title, sub, seg(t, a, a + .35) * (1 - seg(t, b - .3, b)));

// ---------------- shots ----------------
const SHOTS = []; const shot = (t0, t1, r3, ov = () => {}) => SHOTS.push({ t0, t1, r3, ov });

// 1: the lure wall in the tackle shop; lures drop
shot(0, 1.55, t => {
  shopL.forEach((Lr, i) => { const f = ei(seg(t, 1.15 + (i % 5) * .04, 1.55)); Lr.wrap.position.copy(Lr.home).add(V3(0, -f * 4, f * .6)); Lr.wrap.rotation.x = f * 1.5 * Math.sin(i); });

  TIME.value = t; draw(SH, cam, { focus: P.z + .1, aper: lerp(6, 1, seg(t, 0, 1.1)), vig: .45, bloom: .3 });
}, t => {});

// 2: lures fall into the water column and sort into three depths, then rise to the surface band
shot(1.55, 5.0, t => {
  secL.forEach(Lr => {

    Lr.wrap.position.set(Lr.slot.x, y + (k >= 1 ? .06 * Math.sin(t * 2 + Lr.i) : 0), Lr.slot.z); Lr.wrap.rotation.set(0, -.35, (1 - eo(k)) * 1.2 + .05 * Math.sin(t + Lr.i));
  });
  const P = keys([[1.55, V3(0, -2.6, 17.5)], [3.4, V3(0, -2.6, 16.5)], [5.0, V3(0, -.3, 8.5)]], t, eio);
  lookFrom(cam, P, V3(0, P.y - .1, 0));
  sectionMode(t);
}, t => {
  secL.forEach(Lr => { const a = 1.6 + Lr.i * .07; const kk = seg(t, a + .45, a + 1.1); if (kk > 0 && kk < 1) { const s = sp(V3(Lr.slot.x, 0, .9)); UI.screenRing(s.x, s.y, (8 + kk * 40) * S, 1, 'rgba(255,255,255,.9)', { alpha: 1 - kk, sy: .3, n: 22 }); } });
  const k = seg(t, 2.5, 2.9) * (1 - seg(t, 4.0, 4.3));
  UI.polyline(cam, [V3(-4.5, -.8, .9), V3(4.5, -.8, .9)], k, 'rgba(255,255,255,.55)', 1.5, [5, 6]);
  UI.polyline(cam, [V3(-4.5, -4.6, .9), V3(4.5, -4.6, .9)], k, 'rgba(255,255,255,.55)', 1.5, [5, 6]);
  [['Oberfläche', -.4], ['Mittelwasser', -2.6], ['Grund', -6.2]].forEach(([lb, y], i) => { const s = sp(V3(3.7, y, .9)); UI.pill(lb, s.x - 40 * S, s.y, k * seg(t, 2.6 + i * .1, 3.0 + i * .1), { dot: C.gold }); });
  UI.pill('Oberfläche', W / 2, 250 * S, seg(t, 3.9, 4.3), { dot: C.gold });
});

// surface lures on the lake (camera at water level, reflections on)
const P0 = shore(PLACES.bankTh - .3, -9).setY(0), DIRL = V3(1, 0, .15).normalize();
function surfaceCam(t, lp, t0, t1) { const u = seg(t, t0, t1); lookFrom(cam, lp.clone().add(V3(lerp(-.6, -.3, u), .42, 2.3)), lp.clone().add(V3(.15, .02, 0))); }
// 3: popper: chug, spit, ripples
const CHUGS = [5.55, 6.35, 7.15, 7.95];
const popperX = t => CHUGS.reduce((s, c) => s + .32 * eo(seg(t, c, c + .2)), 0);
shot(5.0, 8.85, t => {
  showOnly(['popper']); const P = D.popper; const lp = P0.clone().add(DIRL.clone().multiplyScalar(popperX(t)));
  const dip = CHUGS.reduce((s, c) => s + Math.sin(Math.PI * seg(t, c, c + .3)), 0);
  P.wrap.position.copy(lp).setY(-.03 - dip * .02); P.wrap.rotation.set(.05 * Math.sin(t * 2), Math.atan2(-DIRL.z, DIRL.x), -.12 - dip * .22);

}, t => {
  const lp = P0.clone().add(DIRL.clone().multiplyScalar(popperX(t))), nose = sp(lp.clone().add(DIRL.clone().multiplyScalar(.28)));
  line(nose, 1);
  CHUGS.forEach(c => { splash(nose.x + 6 * S, nose.y - 4 * S, seg(t, c, c + .7), 16); const k = seg(t, c, c + 1.2); if (k > 0 && k < 1) UI.ring(cam, lp.clone().add(DIRL.clone().multiplyScalar(.25)).setY(.01), .1 + k * .7, 1 - k, 'rgba(255,255,255,.85)', { n: 26 }); });
  name('1', 'POPPER', 'Oberfläche', t, 5.1, 8.85);
  UI.callout('ausgehöhlte Front', nose.x, nose.y, 0, -90, seg(t, 5.85, 6.2) * (1 - seg(t, 7.0, 7.3)), { dot: C.gold });
  UI.pill('spuckt Wasserblasen', W / 2, 250 * S, seg(t, 7.1, 7.45) * (1 - seg(t, 8.5, 8.8)), { dot: C.blue });
});
// 4: stickbait: walk-the-dog zigzag
const walk = t => { const u = Math.max(0, t - 9.3), x = u * .42, tri = 2 * Math.abs(((u * 2.2) % 2) - 1) - 1; return { x, side: tri * .18, yaw: -tri * .65 }; };
shot(8.85, 12.95, t => {
  showOnly(['stickbait']); const w = walk(t), side = V3(-DIRL.z, 0, DIRL.x);
  const lp = P0.clone().add(V3(0, 0, -1.2)).add(DIRL.clone().multiplyScalar(w.x)).add(side.clone().multiplyScalar(w.side));
  D.stickbait.wrap.position.copy(lp).setY(-.02); D.stickbait.wrap.rotation.set(0, Math.atan2(-DIRL.z, DIRL.x) + w.yaw, -.05);
  surfaceCam(t, lp, 8.85, 12.95); lakeMode(t, { refl: true, focus: 2.35, aper: 4, shadow: [lp, 8] });
}, t => {
  const side = V3(-DIRL.z, 0, DIRL.x), pts = [];
  for (let u = 9.3; u <= t; u += .05) { const w = walk(u); pts.push(P0.clone().add(V3(0, .01, -1.2)).add(DIRL.clone().multiplyScalar(w.x)).add(side.clone().multiplyScalar(w.side))); }
  if (pts.length > 2) UI.dots(cam, pts.filter((_, i) => i % 2 === 0), 1, { r: 2, alpha: .85 });
  const w = walk(t), lp = P0.clone().add(V3(0, 0, -1.2)).add(DIRL.clone().multiplyScalar(w.x)).add(side.clone().multiplyScalar(w.side)); line(sp(lp), 1);
  name('2', 'STICKBAIT', 'Oberfläche', t, 8.95, 12.95);
  UI.pill('Zickzack', W / 2, 250 * S, seg(t, 10.1, 10.45) * (1 - seg(t, 11.6, 11.85)), { dot: C.gold });
  UI.pill('„Walk-the-Dog“', W / 2, 250 * S, seg(t, 11.85, 12.2), { dot: C.gold });
});
// 5: frog over lily pads
const FROG0 = shore(PLACES.lilyTh + .05, -4.6).setY(0), FROGD = V3(.4, 0, 1).normalize();
const frogX = t => { const u = Math.max(0, t - 13.4); return u * .32 + .12 * Math.sin(u * 4); };
shot(12.95, 18.05, t => {
  showOnly(['frog']); const lp = FROG0.clone().add(FROGD.clone().multiplyScalar(frogX(t)));
  D.frog.wrap.position.copy(lp).setY(.035); D.frog.wrap.rotation.set(0, Math.atan2(-FROGD.z, FROGD.x), .05 * Math.sin(t * 4));
  const u = seg(t, 12.95, 18.05), side = V3(-FROGD.z, 0, FROGD.x);
  lookFrom(cam, lp.clone().add(side.clone().multiplyScalar(-2.1)).add(FROGD.clone().multiplyScalar(-.5)).add(V3(0, lerp(.7, .55, u), 0)), lp.clone().add(V3(0, .05, 0)));
  lakeMode(t, { refl: true, focus: 2.2, aper: 4, shadow: [lp, 8] });
}, t => {
  const lp = FROG0.clone().add(FROGD.clone().multiplyScalar(frogX(t)));
  name('3', 'GUMMIFROSCH', 'Oberfläche', t, 13.1, 18.05);
  { const s = sp(lp.clone().add(V3(0, .12, 0))); UI.callout('Haken eng am Körper', s.x, s.y, 0, -90, seg(t, 14.0, 14.4) * (1 - seg(t, 15.6, 15.9)), { dot: C.gold }); }
  UI.pill('ohne Hänger durchs Kraut', W / 2, 250 * S, seg(t, 16.35, 16.7), { dot: C.green });
});

// mid-water lures (underwater, open water)
const MX = 7.5, MY = -1.9;
function midCam(t, x, y, z = 2.3) { lookFrom(cam, V3(x - .3, y + .15, z), V3(x + .15, y, 0)); }
// 6: spinner
shot(18.05, 23.0, t => {
  showOnly(['spinner', trout, perch]); const x = MX + (t - 18.05) * .45, y = MY;

}, t => {
  const x = MX + (t - 18.05) * .45, s = sp(V3(x + .18, MY, 0)); line(sp(V3(x + .28, MY, 0)), 1);
  name('4', 'SPINNER', 'Mittelwasser', t, 19.1, 23.0);
  UI.callout('Blatt rotiert', s.x, s.y, 0, -90, seg(t, 20.0, 20.4) * (1 - seg(t, 21.4, 21.7)), { dot: C.gold });
  UI.pill('Forellen & Barsche', W / 2, 250 * S, seg(t, 21.7, 22.05), { dot: C.gold });
});
// 7: blinker (spoon): wobble and flash
shot(23.0, 27.3, t => {
  showOnly(['blinker']); const x = MX + 2 + (t - 23) * .4;
  D.blinker.wrap.position.set(x, MY + .05 * Math.sin(t * 4), 0); D.blinker.spoon.rotation.set(Math.PI / 2 + Math.sin(t * 8) * .95, 0, Math.sin(t * 4) * .15);
  midCam(t, x, MY); underMode(t, 'open', { focus: 2.3 });
}, t => {
  const x = MX + 2 + (t - 23) * .4, s = sp(V3(x, MY, 0)); line(sp(V3(x + .28, MY, 0)), 1);
  name('5', 'BLINKER', 'Mittelwasser', t, 23.1, 27.3);
  const fl = Math.pow(Math.max(0, Math.cos(t * 8)), 18); if (t > 25.4) sparkle(s.x, s.y - 10 * S, fl);
  UI.callout('Lichtblitze', s.x, s.y, 0, -90, seg(t, 25.55, 25.9) * (1 - seg(t, 26.3, 26.5)), { dot: C.gold });
  UI.pill('wie ein kranker Beutefisch', W / 2, 250 * S, seg(t, 26.4, 26.75), { dot: C.red });
});
// 8: crankbait: dives with a hard wobble
shot(27.3, 31.6, t => {
  showOnly(['crankbait']); const x = MX + 4 + (t - 27.3) * .45, y = MY + .7 - 1.5 * ss(seg(t, 29.4, 31.2));
  D.crankbait.wrap.position.set(x, y, 0); D.crankbait.wrap.rotation.set(Math.sin(t * 19) * .35, 0, -.35 * Math.sin(Math.PI * seg(t, 29.4, 31.2)));
