<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#0f2a44"/>
  <!-- cast line: dotted arc landing on the fish -->
  <path d="M96 148 Q 200 40 300 200" fill="none" stroke="#f2a33a" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 24"/>
  <!-- fish body + tail -->
  <path d="M120 300 C 170 220, 300 210, 360 300 C 300 390, 170 380, 120 300 Z" fill="#ffffff"/>
  <path d="M352 300 L 418 252 L 404 300 L 418 348 Z" fill="#ffffff"/>
  <!-- eye -->
  <circle cx="172" cy="292" r="11" fill="#0f2a44"/>
  <!-- gill line -->
  <path d="M205 262 Q 220 300 205 338" fill="none" stroke="#0f2a44" stroke-width="8" stroke-linecap="round"/>
  <!-- the "spot": where the fish is -->
  <circle cx="300" cy="200" r="16" fill="#f2a33a"/>
  <circle cx="300" cy="200" r="30" fill="none" stroke="#f2a33a" stroke-width="5" opacity=".5"/>
</svg>
