shot(42.05, 47.25, t => {
  tbShad.desat = 0; tbShad.wrap.position.y = .07 + .05 * ss(seg(t, 42.3, 42.8)); tbWob.wrap.position.y = .07 + .2 * ss(seg(t, 45.6, 46.3)); tbWob.wrap.scale.setScalar(.62 * (1 + .3 * ss(seg(t, 45.6, 46.3))));

}, t => {
  { const s = sp(V3(-.1, .1, -.65)); UI.callout('schwerer Gummifisch', s.x, s.y, 0, -90, seg(t, 42.35, 42.7), { icon: 'x' }); }
  { const s = sp(V3(.1, .25, .45)); UI.callout('schlanker Flachläufer', s.x, s.y, 0, -80, seg(t, 45.75, 46.1), { dot: C.green }); }
});

// 12: night top-down: cast parallel to the stones, retrieve in slow motion
const castT = 47.4, PT = shore(PLACES.bankTh + .33, -1.0).setY(.05);
shot(47.25, 52.35, t => {
  A.root.position.copy(spot); A.root.rotation.y = Math.atan2(-(PT.x - spot.x), -(PT.z - spot.z)); A.apply(castPose(t - castT), t);

  const kr = seg(t, 49.0, 52.3), pts = []; for (let i = 0; i <= 40; i++) pts.push(PT.clone().lerp(spot.clone().setY(.05), i / 40 * .55)); if (kr > 0) UI.polyline(cam, pts, kr * .9, 'rgba(255,214,120,.9)', 2.5, [3, 9]);
  { const s = sp(PT); UI.callout('parallel zur Steinpackung', s.x, s.y, 0, -70, seg(t, 47.5, 47.9) * (1 - seg(t, 49.4, 49.7)), { dot: C.gold }); }
  UI.pill('fast in Zeitlupe', W / 2, 250 * S, seg(t, 51.1, 51.45), { dot: C.blue });
});

// 13: low behind the boots at the water's edge: the eyes are right there
shot(52.35, 59.7, t => {

  lookFrom(cam, spot.clone().add(V3(.45, .85, 1.5)), shore(PLACES.bankTh, -1.0).setY(-.25));

  e.forEach((p, i) => { const s = sp(p); g.save(); g.globalCompositeOperation = 'lighter'; const k = seg(t, 54.6 + i * .2, 55.2 + i * .2) * (.75 + .25 * Math.sin(t * 2 + i)); for (const dx of [-7, 7]) { const r = 15 * S, gr = g.createRadialGradient(s.x + dx * S, s.y, 0, s.x + dx * S, s.y, r); gr.addColorStop(0, `rgba(255,248,210,${k})`); gr.addColorStop(1, 'rgba(255,200,90,0)'); g.fillStyle = gr; g.beginPath(); g.arc(s.x + dx * S, s.y, r, 0, 7); g.fill(); } g.restore(); });
  UI.pill('nicht am Grund', W / 2, 230 * S, seg(t, 53.4, 53.75) * (1 - seg(t, 54.6, 54.85)), { icon: 'x' });
  UI.pill('direkt vor deinen Stiefeln', W / 2, 230 * S, seg(t, 55.55, 55.9), { dot: C.gold });
});

// ---------------- dispatcher ----------------
const DISS = { 4.55: .4, 7.5: .35, 11.4: .35, 17.7: .45, 24.6: .45, 30.65: .45, 42.05: .4, 47.25: .4, 52.35: .4 };
const glc = renderer.domElement;
const Q = new URLSearchParams(location.search), OFF = +(Q.get('off') || 0);
window.DUR = Q.get('dur') ? +Q.get('dur') : 59.7;
window.render = t => { t += OFF;
  UI.clear();
  const i = SHOTS.findIndex(s => t >= s.t0 && t < s.t1), s = SHOTS[i < 0 ? SHOTS.length - 1 : i];
  const d = DISS[s.t0], prev = SHOTS[i - 1];
  if (d && prev && t < s.t0 + d / 2) { prev.r3(t); UI.grab(glc); s.r3(t); UI.overlaySnap(1 - ss((t - (s.t0 - d / 2)) / d)); }
  else { const nx = SHOTS[i + 1], dn = nx && DISS[nx.t0];
    if (dn && t > nx.t0 - dn / 2) { s.r3(t); UI.grab(glc); nx.r3(t); UI.clear(); UI.overlaySnap(1 - ss((t - (nx.t0 - dn / 2)) / dn)); } else s.r3(t); }
  s.ov(t);
  UI.karaoke(t);
  UI.endCard(t, 56.3, 6, [['Nachts:', 0]], [['flach', 1], [' fischen.', 0]], logo);
};

  { t: 17.7, type: 'whoosh' }, { t: 24.6, type: 'whoosh' }, { t: 30.65, type: 'whoosh' }, { t: 38.35, type: 'swish' }, { t: 40.8, type: 'dart' }, { t: 42.05, type: 'whoosh' }, { t: 42.4, type: 'tick' }, { t: 45.8, type: 'ding' },
  { t: 47.25, type: 'whoosh' }, { t: castT + .6, type: 'swish' }, { t: castT + 1.3, type: 'plop' }, { t: 49.0, type: 'reel', d: 3.2 }, { t: 52.35, type: 'whoosh' }, { t: 56.3, type: 'whoosh' }, { t: 56.9, type: 'ding' },
];
